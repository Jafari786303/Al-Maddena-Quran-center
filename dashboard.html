<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tajweed Center Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="wrap panel" id="userArea">
        <h3>Dashboard</h3>
        <div id="profileCard" class="profile"></div>

        <div class="grid-2">
          <form id="courseApplyForm" class="card hidden">
            <h4>Course Enrollment</h4>
            <label>Main Course
              <select name="mainCourse" required>
                <option value="quranyath">Quranyath</option>
                <option value="ahkam">Ahkam</option>
                <option value="akhlaq">Akhlaq</option>
                <option value="seerath">Seerath</option>
              </select>
            </label>
            <label>Tajweed Stage (for Quranyath only)
              <select name="tajweedStage">
                <option value="">Not Applicable</option>
                <option value="beginner_stage">Beginner Stage</option>
                <option value="intermediate_stage">Intermediate Stage</option>
                <option value="expert_stage">Expert Stage</option>
                <option value="full_teacher_stage">Full Teacher Stage</option>
              </select>
            </label>
            <label>Free Timings for Online Classes
              <textarea required name="freeTimes" rows="2"></textarea>
            </label>
            <label>Any similar course before?
              <textarea required name="previousExperience" rows="2"></textarea>
            </label>
            <button type="submit">Submit Enrollment</button>
          </form>

          <div class="card hidden" id="teacherStudentsCard">
            <h4>Assigned Students</h4>
            <div id="teacherStudents"></div>
          </div>
        </div>

        <div class="chat-wrap hidden" id="chatWrap">
          <div class="chat-head">
            <h4>Chat</h4>
            <p id="chatMeta">Select a chat target</p>
          </div>
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-form">
            <input name="message" placeholder="Type message..." required />
            <button>Send</button>
          </form>
        </div>
      </section>
    </main>

    <section class="admin hidden" id="adminPanel">
      <div class="admin-content wrap">
        <h3>Admin Panel</h3>
        <div class="grid-2">
          <div class="card"><h4>All Users</h4><div id="adminUsers"></div></div>
          <div class="card"><h4>Enrollments & Teacher Assignment</h4><div id="adminEnrollments"></div></div>
        </div>
      </div>
    </section>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
